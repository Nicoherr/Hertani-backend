spring.application.name=wim100-backend
server.port=8080

# Conexión a MySQL (la base se crea sola si no existe)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/wim100?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
